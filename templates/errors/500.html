{% load static %}

<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Внутренняя ошибка сервера</title>
    <link href="{% static 'bootstrap-5.3.8-dist/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'bootstrap-icons/font/bootstrap-icons.css' %}" rel="stylesheet">
    <script src="{% static 'bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js' %}"></script>
</head>
<body class="bg-body-tertiary">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-5">
            <div class="col-12 col-md-8 col-lg-6 text-center">

                <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-4"
                     style="width:120px;height:120px;">
                    <i class="bi bi-tools" style="font-size:3.5rem;"></i>
                </div>

                <h1 class="display-1 fw-bold text-primary mb-0">500</h1>
                <h2 class="h3 fw-bold mb-3">Что-то сломалось</h2>

                <p class="text-body-secondary mb-4">
                    На сервере произошла непредвиденная ошибка.
                    Мы уже знаем о проблеме и работаем над её устранением.
                    Попробуйте обновить страницу через пару минут.
                </p>

                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                    <button type="button" class="btn btn-primary btn-lg" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise me-1"></i>
                        Обновить
                    </button>
                    <a href="/" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-house-door me-1"></i>
                        На главную
                    </a>
                </div>


            </div>
        </div>
    </div>

</body>
</html>

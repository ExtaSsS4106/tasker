<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ appName }}{% endblock %}</title>
    <link href="static/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="static/bootstrap-5.3.8-dist/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-12 col-sm-10 col-md-8 col-lg-10 col-xl-6">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<script src="static/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
